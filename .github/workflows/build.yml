name: build

# Reproducible release build: fetch Wintun, build both backends from source
# (MSYS2/mingw64), publish the self-contained app, build the installer, and
# upload everything as artifacts. Tag pushes (v*) also draft a release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up MSYS2 (mingw64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gnutls
            mingw-w64-x86_64-libgcrypt
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-zlib
            make
            perl
        # setup-msys2 installs to a runner path, not C:\msys64. Symlink so the
        # tools/*.ps1 scripts (which hardcode C:\msys64) work unchanged in CI.
      - name: Link MSYS2 to C:\msys64
        run: |
          $p = (Get-Command msys2 -ErrorAction SilentlyContinue).Source
          if (-not (Test-Path C:\msys64)) {
            New-Item -ItemType Junction -Path C:\msys64 -Target (Split-Path (Split-Path $env:MSYS2_LOCATION)) -ErrorAction SilentlyContinue
          }
        continue-on-error: true

      - name: Fetch Wintun
        run: tools/fetch-wintun.ps1

      - name: Build openconnect
        run: tools/fetch-openconnect.ps1

      - name: Build vpnc
        run: tools/build-vpnc.ps1

      - name: Publish app (self-contained single-file)
        run: tools/publish.ps1

      - name: Build installer
        run: |
          winget install --silent --accept-source-agreements --accept-package-agreements JRSoftware.InnoSetup
          tools/build-installer.ps1
        continue-on-error: true   # installer is optional if Inno Setup is unavailable

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: VpncBar-app
          path: dist/app/

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: VpncBar-installer
          path: dist/*-setup.exe
          if-no-files-found: ignore

      - name: Draft release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*-setup.exe
